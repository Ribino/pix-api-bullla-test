global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: pix-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
  - job_name: pix-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8083
